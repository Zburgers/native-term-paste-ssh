name: PowerShell compatibility

on: [push, pull_request]

jobs:
  parse-windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse installer and runtime with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @('.\install.ps1', '.\native-term-paste-ssh.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
            Write-Host "Parsed $file"
          }
          . .\native-term-paste-ssh.ps1
          $profileTokens = $null
          $profileErrors = $null
          [System.Management.Automation.Language.Parser]::ParseInput((Get-SshProfileBlock), [ref]$profileTokens, [ref]$profileErrors) | Out-Null
          if ($profileErrors.Count -gt 0) { $profileErrors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Host 'Parsed generated SSH profile integration'

  parse-powershell-7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse installer and runtime with PowerShell 7
        shell: pwsh
        run: |
          $files = @('.\install.ps1', '.\native-term-paste-ssh.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
            Write-Host "Parsed $file"
          }
          . .\native-term-paste-ssh.ps1
          $profileTokens = $null
          $profileErrors = $null
          [System.Management.Automation.Language.Parser]::ParseInput((Get-SshProfileBlock), [ref]$profileTokens, [ref]$profileErrors) | Out-Null
          if ($profileErrors.Count -gt 0) { $profileErrors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Host 'Parsed generated SSH profile integration'
